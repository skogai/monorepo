monorepo_root = true

# [plugins]
# skogai = "https://github.com/skogai/mise-plugin"

[env]
# _.skogai = { api_key = " env key" } # this would be installed by the plugins.skogai above
_.skogai-develop = { api_key = "test env key" } # this is a simple symlink / mise plugins link
SKOGAI_HELLO_GREETING = "hello from the monorepo root!"

[monorepo]
# config_roots = ["skogai","skogix"]
config_roots = ["mise-plugin"]

[tools]
usage = { version = "latest", workflow = "publish-cli.yml" }
worktrunk = { version = "latest", workflow = "release.yaml" }

# [_.skogai.hello]
# description = "greet someone and keep the greeting in /tmp/greeting.txt"
# owns = ["/tmp/greeting.txt"]
# writes = ["/tmp/greeting.txt"]

[tasks.hello]
usage = 'arg "<who>"'
run = 'echo "MONOREPO: $SKOGAI_HELLO_GREETING $usage_who" | tee /tmp/greeting.txt'

