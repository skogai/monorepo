# Base configuration: loaded for every environment.
# Environment-specific fragments live in .config/mise/conf.d/, see doc/mise.md.
# monorepo_root = true

# [monorepo]
# config_roots = ["repos/mise-plugin"]

[env]
# The plugin cannot see an environment chosen in .miserc.toml, so this stays a template.
SKOGAI_MISE_ENV = "{{ mise_env | default(value=[]) | join(sep=',') | replace(from=' ', to='') }}"
# The skogai plugin, in every environment once installed. Its source and pin are in
# .config/mise/conf.d/plugin.skogai.toml; with no source loaded, mise skips it with a warning
# instead of failing. It sets SKOGAI_MONOREPO_DIR, SKOGAI_CONFIG_DIR and the SKOGAI_HOST,
# SKOGAI_OS and SKOGAI_ARCH defaults. A value set above this line, or in mise.local.toml, wins.
_.skogai = { paths = ["bin", ".skogai/bin"] }
COUNCIL_PROVIDERS = "claude-cli,codex"

[tools]
gh = { version = "latest", minimum_release_age = "0s", lazy = true }
usage = { version = "7.3.0", workflow = "publish-cli.yml" }
worktrunk = { version = "latest", workflow = "release.yaml" }
actionlint = "latest"
hk = "latest"
lua = "5.5.1"
lua-language-server = "latest"
pkl = "latest"
stylua = "latest"
jq = "latest"
yq = "latest"
mani = "latest"
code-review-graph = "latest"
uv = "latest"
# python 3.14: PyYAML 6.0.3 has no cp315 wheels: on 3.15 code-review-graph can only get a version-only lock
python = "3.14"
npm = "latest"
"npm:agenttrail" = "latest"


# GitHub OAuth for mise, gh and git push. See doc/github-auth.md.
[settings.github]
oauth_client_id = "Iv23liQkKChCS4oXgq10"

[tasks."github:auth"]
description = "Log in to GitHub with mise OAuth, or refresh the token"
run = [
  "mise token github --oauth --refresh",
  "mise token github",
  "echo 'The old token is now revoked. In open shells, run: unset GITHUB_TOKEN (or wait for the next prompt).'",
]

[tasks."agents:repomix"]
description = "Pack a cloned repo (or every cloned repo) into repomix output inside that repo"
usage = 'arg "[repo]" help="Catalog name (omit for every cloned repo)"'
run = '''
set -eu
if [ -n "${usage_repo:-}" ]; then
  mani sync -t "$usage_repo" --ignore-sync-state
  mani run repomix -t "$usage_repo"
else
  mani run repomix --all --ignore-non-existing
fi
'''

# Cache of each catalog repo's root AGENTS.md in agents/<name>.md. The per-repo task is in mani.yaml.
[tasks."agents:refresh"]
description = "Refresh agents/<name>.md from the repos already cloned (clones nothing)"
quiet = true
run = '''
set -eu
cd "{{config_root}}"
mani run agents-cache --all --ignore-non-existing --silent --parallel -o table >/dev/null
changes=$(git status --short -- agents)
echo "ok   $(ls agents/*.md | wc -l) cached copies in agents/"
[ -z "$changes" ] || { echo "     changed since the last commit:"; printf '%s\n' "$changes" | sed 's/^/     /'; }
'''

[tasks."agents:prune"]
description = "Delete agents/<name>.md files whose repo is no longer in mani.yaml"
quiet = true
run = '''
set -eu
cd "{{config_root}}"
names=$(yq -r '.projects | keys | .[]' mani.yaml)
for f in agents/*.md; do
  [ -e "$f" ] || continue
  n=$(basename "$f" .md)
  printf '%s\n' "$names" | grep -qxF "$n" || { rm -f "$f"; echo "removed $f (not in mani.yaml)"; }
done
'''

[tasks."agents:sync"]
description = "Clone every catalog repo, refresh agents/, and prune copies of removed repos"
run = [
  "mani sync --ignore-sync-state",
  { task = "agents:refresh" },
  { task = "agents:prune" },
]

[tasks."catalog:check"]
description = "Check mani.yaml: every project lazy, path repos/<name>, tagged with its name, GitHub URL"
quiet = true
run = '''
set -eu
yq -r '.projects | to_entries[] | [.key, .value.path, (.value.sync|tostring), ((.value.tags // [])|join(",")), .value.url] | @tsv' "{{config_root}}/mani.yaml" |
awk -F'\t' '
  { n = $1; c++
    if ($3 != "false") bad(n ": sync is " $3)
    if ($2 != "repos/" n) bad(n ": path is " $2 ", expected repos/" n)
    if (index("," $4 ",", "," n ",") == 0) bad(n ": tags lack " n)
    if ($5 !~ /^https:\/\/github\.com\/[^\/]+\/[^\/]+$/) bad(n ": url is " $5) }
  function bad(m) { print "FAIL " m; f = 1 }
  END { if (!f) print "ok   " c " projects in mani.yaml"; exit f }'
'''

[tasks.lint]
description = "Lint the GitHub workflows and check mise config formatting"
quiet = true
run = ["actionlint", "mise fmt --check"]

# The wiki in openwiki/ covers the mani.yaml projects tagged `openwiki`.
[tasks."openwiki:clone"]
description = "Clone the repos the wiki (openwiki/) covers into repos/"
run = "mani sync -t openwiki --ignore-sync-state"

# agenttrail Map (npm:agenttrail above) for this repo, read by the herdr-app
# agenttrail panel on 127.0.0.1:5330-5344. agenttrail exits early by itself
# when a board for this repo is already up. Saved boards: ~/.agenttrail/.
# It takes any unknown argument as a repo path (there is no --help): `agenttrail --help`
# registers a board for ./--help. Use these tasks instead of calling it by hand.
[tasks."agenttrail:start"]
description = "Run the agenttrail Map for this repo in the foreground (Ctrl-C stops it)"
run = 'agenttrail "{{config_root}}" --no-open'

[tasks."agenttrail:up"]
description = "Start the agenttrail Map for this repo in the background; log in ~/.agenttrail/Work.log"
quiet = true
run = """
setsid -f agenttrail "{{config_root}}" --no-open >>"$HOME/.agenttrail/Work.log" 2>&1 </dev/null
for i in $(seq 1 50); do
  for p in $(seq 5330 5344); do
    if curl -s -m 0.3 "http://127.0.0.1:$p/whoami" | grep -q "\\"repoPath\\":\\"{{config_root}}\\""; then
      echo "agenttrail up: http://localhost:$p"; exit 0
    fi
  done
  sleep 0.2
done
echo "agenttrail did not come up; see ~/.agenttrail/Work.log" >&2; exit 1
"""

[tasks."agenttrail:status"]
description = "List the agenttrail Maps running on this machine (any repo)"
quiet = true
run = """
found=0
for p in $(seq 5330 5344); do
  w=$(curl -s -m 0.3 "http://127.0.0.1:$p/whoami") || continue
  echo "$p  $(echo "$w" | jq -r .repoPath)"; found=1
done
[ "$found" = 1 ] || echo "no agenttrail Map running"
"""

[tasks."agenttrail:stop"]
description = "Stop the agenttrail Map for this repo"
quiet = true
run = """
if pkill -f 'agenttrail\\.mjs {{config_root}}( |$)'; then echo "agenttrail stopped"; else echo "agenttrail was not running for this repo"; fi
"""

# Basic environment variables: see doc/mise.md, "Basic environment variables".
[tasks."env:show"]
description = "Show the SKOGAI_ variables mise sets here"
quiet = true
run = "env | grep '^SKOGAI_' | sort -t= -k1,1 | awk '{ i = index($0, \"=\"); printf \"%-28s %s\\n\", substr($0, 1, i - 1), substr($0, i + 1) }'"

[tasks."env:test"]
description = "Check that the skogai plugin loaded and the basic variables are valid"
quiet = true
run = """
fail=0
ok() { echo "ok   $1"; }
bad() { echo "FAIL $1"; fail=1; }
if [ -z "${SKOGAI_MONOREPO_DIR:-}" ]; then
  bad "skogai plugin loaded: SKOGAI_MONOREPO_DIR is unset. Install it with: mise plugins install skogai"
else
  ok "skogai plugin loaded"
fi
[ "${SKOGAI_MONOREPO_DIR:-}" = "{{config_root}}" ] && ok "SKOGAI_MONOREPO_DIR is this checkout"   || bad "SKOGAI_MONOREPO_DIR is '${SKOGAI_MONOREPO_DIR:-}', expected '{{config_root}}'"
[ -n "${SKOGAI_HOST:-}" ] && ok "SKOGAI_HOST is set: $SKOGAI_HOST" || bad "SKOGAI_HOST is empty; set it in mise.local.toml"
case "${SKOGAI_OS:-}" in linux | macos | windows) ok "SKOGAI_OS is valid: $SKOGAI_OS" ;; *) bad "SKOGAI_OS is '${SKOGAI_OS:-}'" ;; esac
case "${SKOGAI_ARCH:-}" in x64 | arm64 | x86) ok "SKOGAI_ARCH is valid: $SKOGAI_ARCH" ;; *) bad "SKOGAI_ARCH is '${SKOGAI_ARCH:-}'" ;; esac
[ -n "${SKOGAI_MISE_ENV+set}" ] && ok "SKOGAI_MISE_ENV is defined: '$SKOGAI_MISE_ENV'" || bad "SKOGAI_MISE_ENV is not defined"
host=$(uname -n)
[ "${SKOGAI_HOST:-}" = "$host" ] || echo "note SKOGAI_HOST differs from uname -n ($host): overridden in config or the shell"
exit $fail
"""

[tasks."env:context"]
description = "Print where this runs, for agents and commit messages"
quiet = true
usage = 'flag "--trailers" help="Print git commit trailers instead"'
run = """
dir="{{config_root}}"
branch=$(git -C "$dir" branch --show-current 2>/dev/null || true)
commit=$(git -C "$dir" rev-parse --short HEAD 2>/dev/null || true)
if [ "${usage_trailers:-false}" = true ]; then
  echo "Host: ${SKOGAI_HOST:-}"
  echo "Platform: ${SKOGAI_OS:-}-${SKOGAI_ARCH:-}"
  echo "Mise-Env: ${SKOGAI_MISE_ENV:-none}"
else
  echo "host:     ${SKOGAI_HOST:-}"
  echo "platform: ${SKOGAI_OS:-}-${SKOGAI_ARCH:-}"
  echo "mise env: ${SKOGAI_MISE_ENV:-none}"
  echo "checkout: $dir"
  echo "git:      ${branch:-detached} at ${commit:-unknown}"
fi
"""

# A bare `mise run`: the everyday startup. Each step warns and the run continues, so a missing
# server (LM Studio, T3) never blocks the rest. Ends with `next`, the "hi" view.
[tasks.default]
description = "Daily startup: install tools, check env and catalog, refresh caches and graph, relaunch boards, show next"
quiet = true
run = '''
step() { name=$1; shift; printf '\n== %s\n' "$name"; "$@" || printf 'WARN %s failed (exit %s); continuing\n' "$name" "$?"; }
step "tools"          mise install --quiet
step "environment"    mise run env:test
step "catalog"        mise run catalog:check
step "agents cache"   mise run agents:refresh
if mise run crg:health >/dev/null 2>&1; then
  step "code graph"   mise run crg:update
else
  step "code graph (no embedding server: graph only)" mise run crg:update --no-embed
fi
step "agenttrail"     mise run agenttrail:up
step "T3"             mise run t3:health
step "next"           mise run next
'''

# Session start: what "hi" means in doc/agent-workflow.md, "Starting a session".
[tasks.next]
description = "Show open PRs and project 4 work, and the next item per track"
quiet = true
run = """
set -eu
repo=skogai/monorepo
show() { if [ -n "$1" ]; then printf '%s\\n' "$1"; else echo "  none"; fi; }
echo "== Open pull requests ($repo): review or merge these first"
show "$(gh pr list -R "$repo" --json number,title,headRefName,isDraft,reviewDecision \
  --jq '.[] | "#\\(.number)  \\(.title)  [\\(.headRefName)\\(if .isDraft then ", draft" else "" end)\\(if .reviewDecision != "" then ", " + .reviewDecision else "" end)]"' \
  | sed 's/^/  /')"
items=$(gh project item-list 4 --owner skogai --format json -L 200 \
  --jq '.items[] | select(.status != "Done") | [.status, (.content.number|tostring), ((.labels // [])|join(",")), .title] | @tsv')
echo
echo "== In progress"
show "$(printf '%s\\n' "$items" | awk -F'\\t' '$1 == "In Progress" { printf "  #%s  %s  [%s]\\n", $2, $4, $3 }')"
echo
echo "== Next per track (first open item in board order)"
for track in roadmap mise-toolkit backlog; do
  printf '%s\\n' "$items" | awk -F'\\t' -v t="$track" '$1 == "Todo" && $3 ~ t { printf "  %-13s #%s  %s\\n", t, $2, $4; exit }'
done
echo
echo "== Open items: $(printf '%s\\n' "$items" | grep -c . || true) (board: https://github.com/orgs/skogai/projects/4)"
"""
