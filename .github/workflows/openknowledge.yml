name: Open Knowledge

on:
  pull_request:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  checks:
    name: Open Knowledge checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      # The upstream openknowledge-sh/openknowledge action installs an npm
      # package that is not published (E404), so install the pinned release
      # through mise and run the same automation command the action runs.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: "github:openknowledge-sh/openknowledge"
          # Submodules are not checked out here, so the `mise-plugin` config
          # root is absent and `mise install --monorepo` fails.
          monorepo: false
      - name: Run Open Knowledge checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          openknowledge automation github run \
            --event "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF_NAME" \
            --base "$BASE_SHA" \
            --path wiki \
            --eval .openknowledge/evals/knowledge.yaml \
            --baseline .openknowledge/audit-sources.json \
            --reports "$RUNNER_TEMP/openknowledge-reports"
      - name: Upload knowledge reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openknowledge-reports
          path: ${{ runner.temp }}/openknowledge-reports
          if-no-files-found: warn
          retention-days: 30
