# T3 tasks for the workstation installation
[env]
T3CODE_HOME = "{{env.HOME}}/.t3"
T3_LOCAL_ROOT = "{{config_root}}"
T3_LOCAL_PORT = "3773"

[tasks."t3:serve"]
description = "Start the local T3 server in the foreground (stop existing instance first)"
interactive = true
run = 't3 serve --base-dir "$T3CODE_HOME" --host 127.0.0.1 --port "$T3_LOCAL_PORT" "$T3_LOCAL_ROOT"'

[tasks."t3:info"]
description = "Show the selected local T3 directory and URL"
run = 'printf "Base: %s\nProject: %s\nURL: http://127.0.0.1:%s\n" "$T3CODE_HOME" "$T3_LOCAL_ROOT" "$T3_LOCAL_PORT"'

[tasks."t3:status"]
description = "Show local T3 service/access settings (not a health check)"
run = 't3 status --base-dir "$T3CODE_HOME"'

[tasks."t3:health"]
description = "Check that the local T3 HTTP server responds"
run = 'curl --fail --silent --show-error --output /dev/null --write-out "HTTP %{http_code}\n" "http://127.0.0.1:$T3_LOCAL_PORT/"'

[tasks."t3:projects"]
description = "List local projects (read-only internal database query)"
run = """
sqlite3 -readonly -header -column "$T3CODE_HOME/userdata/statev2.sqlite" '
SELECT project_id, title, workspace_root FROM projection_projects
WHERE deleted_at IS NULL ORDER BY title;'
"""

[tasks."t3:threads"]
description = "List threads in this checkout project"
run = 't3 thread list --base-dir "$T3CODE_HOME" --project "$T3_LOCAL_ROOT"'

[tasks."t3:threads-all"]
description = "List all local threads, including archived (read-only internal query)"
run = """
sqlite3 -readonly -header -column "$T3CODE_HOME/userdata/statev2.sqlite" '
SELECT p.title AS project, t.title, t.thread_id, t.archived_at
FROM orchestration_v2_projection_threads t
LEFT JOIN projection_projects p ON p.project_id = t.project_id
WHERE t.deleted_at IS NULL ORDER BY t.updated_at DESC;'
"""

[tasks."t3:show"]
description = "Read a thread by ID"
usage = 'arg "<thread>" help="Thread ID from the list"'
run = 't3 thread show --base-dir "$T3CODE_HOME" "$usage_thread"'

[tasks."t3:start"]
description = "Start an agent thread in this checkout"
usage = 'arg "<message>" help="Prompt, or - to read stdin"'
interactive = true
run = 't3 thread start --base-dir "$T3CODE_HOME" "$T3_LOCAL_ROOT" "$usage_message"'

[tasks."t3:send"]
description = "Send a follow-up to a thread (queues if busy)"
usage = '''
arg "<thread>" help="Thread ID"
arg "<message>" help="Prompt, or - to read stdin"
'''
interactive = true
run = 't3 thread send --base-dir "$T3CODE_HOME" "$usage_thread" "$usage_message"'

[tasks.t3]
description = "Pick a project and thread; read messages or compose a prompt"
interactive = true
tools = { gum = "2.0.2" }
run = 'python3 "$T3_LOCAL_ROOT/scripts/t3-picker.py"'

[tasks.default]
description = "Open the local T3 interactive picker"
depends = ["t3"]

[tasks."t3:init"]
description = "Register this checkout in the running local T3 server"
run = 't3 project add --base-dir "$T3CODE_HOME" "$T3_LOCAL_ROOT" --title "Monorepo"'
