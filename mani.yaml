# Catalog of SkogAI repos, managed with mani (https://manicli.com).
# Unpinned and uncoupled: mani records no commits and ties no repos together.
# Each repo is cloned on demand into repos/<name> (ignored, see .gitignore).
#
#   mani list projects        what the catalog holds
#   mani sync --status        what is cloned here
#   mani sync -d repos/<name> clone one repo (plain `mani sync` clones all)
#   mani run agents           print each cloned repo's root AGENTS.md
projects:
  mise-plugin:
    path: repos/mise-plugin
    url: https://github.com/skogai/mise-plugin
  podman:
    path: repos/podman
    url: https://github.com/skogai/podman
  nvim-omarchy:
    path: repos/nvim-omarchy
    url: https://github.com/skogai/nvim-omarchy
  cloudflare:
    path: repos/cloudflare
    url: https://github.com/skogai/cloudflare
  skogai:
    path: repos/skogai
    url: https://github.com/skogai/skogai
  skogai-core:
    path: repos/skogai-core
    url: https://github.com/skogai/skogai-core
  skogai-jq:
    path: repos/skogai-jq
    url: https://github.com/skogai/skogai-jq
  skogix:
    path: repos/skogix
    url: https://github.com/skogai/skogix
  skogai-nov10:
    path: repos/skogai-nov10
    url: https://github.com/skogai/skogai-nov10
  core:
    path: repos/core
    url: https://github.com/skogai/core
  docs:
    path: repos/docs
    url: https://github.com/skogai/docs
  systemd:
    path: repos/systemd
    url: https://github.com/skogai/systemd
  skogai-routing:
    path: repos/skogai-routing
    url: https://github.com/skogai/skogai-routing
  dash-skogai:
    path: repos/dash-skogai
    url: https://github.com/skogai/dash-skogai
  dot-skogai:
    path: repos/dot-skogai
    url: https://github.com/skogai/dot-skogai
  # skogai2 org: prefixed with skogai2- where names overlap the skogai org
  skogai2-skogai:
    path: repos/skogai2-skogai
    url: https://github.com/skogai2/skogai
  skogai2-config:
    path: repos/skogai2-config
    url: https://github.com/skogai2/config
  skogai2-marketplace:
    path: repos/skogai2-marketplace
    url: https://github.com/skogai2/marketplace
  skogai2-skogpunk:
    path: repos/skogai2-skogpunk
    url: https://github.com/skogai2/skogpunk
  skogai2-core:
    path: repos/skogai2-core
    url: https://github.com/skogai2/core
  skogai2-skogix:
    path: repos/skogai2-skogix
    url: https://github.com/skogai2/skogix
  skogai2-aliasflare:
    path: repos/skogai2-aliasflare
    url: https://github.com/skogai2/aliasflare
  skogai2-dot-skogai:
    path: repos/skogai2-dot-skogai
    url: https://github.com/skogai2/dot-skogai
  skogai2-dash-skogai:
    path: repos/skogai2-dash-skogai
    url: https://github.com/skogai2/dash-skogai
  skogai2-skogai-runner:
    path: repos/skogai2-skogai-runner
    url: https://github.com/skogai2/skogai-runner
  skogai2-skogai-routing:
    path: repos/skogai2-skogai-routing
    url: https://github.com/skogai2/skogai-routing
  skogai2-docs:
    path: repos/skogai2-docs
    url: https://github.com/skogai2/docs
  skogai2-cli:
    path: repos/skogai2-cli
    url: https://github.com/skogai2/cli
  skogai2-skogai-fleet:
    path: repos/skogai2-skogai-fleet
    url: https://github.com/skogai2/skogai-fleet
tasks:
  agents:
    desc: Print the root AGENTS.md of each cloned repo
    cmd: cat AGENTS.md 2>/dev/null || echo "(no AGENTS.md)"
