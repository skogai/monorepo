    url: https://github.com/skogai2/skogai
    sync: false
    tags: [skogai2-skogai]
  skogai2-config:
    path: repos/skogai2-config
    url: https://github.com/skogai2/config
    sync: false
    tags: [skogai2-config]
  skogai2-marketplace:
    path: repos/skogai2-marketplace
    url: https://github.com/skogai2/marketplace
    sync: false
    tags: [skogai2-marketplace]
  skogai2-skogpunk:
    path: repos/skogai2-skogpunk
    url: https://github.com/skogai2/skogpunk
    sync: false
    tags: [skogai2-skogpunk]
  skogai2-core:
    path: repos/skogai2-core
    url: https://github.com/skogai2/core
    sync: false
