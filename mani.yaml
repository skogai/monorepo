  skogix:
    path: repos/skogix
    url: https://github.com/skogai/skogix
    sync: false
    tags: [skogix]
  skogai-nov10:
    path: repos/skogai-nov10
    url: https://github.com/skogai/skogai-nov10
    sync: false
    tags: [skogai-nov10]
  core:
    path: repos/core
    url: https://github.com/skogai/core
    sync: false
    tags: [core]
  docs:
    path: repos/docs
    url: https://github.com/skogai/docs
    sync: false
    tags: [docs]
  systemd:
    path: repos/systemd
    url: https://github.com/skogai/systemd
    sync: false
    tags: [systemd]
  skogai-routing:
    path: repos/skogai-routing
    url: https://github.com/skogai/skogai-routing
    sync: false
    tags: [skogai-routing]
  dash-skogai:
    path: repos/dash-skogai
    url: https://github.com/skogai/dash-skogai
    sync: false
    tags: [dash-skogai]
  dot-skogai:
    path: repos/dot-skogai
    url: https://github.com/skogai/dot-skogai
    sync: false
    tags: [dot-skogai]
  # skogai2 org: prefixed with skogai2- where names overlap the skogai org
  skogai2-skogai:
